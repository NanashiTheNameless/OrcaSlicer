on:
    workflow_call:
      inputs:
        cache-key:
          required: false
          type: string
        cache-path:
          required: false
          type: string
        os:
          required: true
          type: string
        arch:
          required: false
          type: string
        compiler:
          required: false
          type: string
          default: msvc
        macos-combine-only:
          required: false
          type: boolean
          default: false

jobs:
  build_orca:
    name: Build OrcaSlicer
    runs-on: ${{ inputs.os }}
    env:
      date: ""
      ver: ""
      ver_pure: ""
      ubuntu-ver: ""
      # Private material is passed only to signing steps on trusted refs.
      # PRs (including same-repository PRs) and other forks never import this key.
      NN_SIGNING_ENABLED: ${{ github.repository == 'NanashiTheNameless/OrcaSlicer' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
      ORCA_UPDATER_SIG_KEY: ${{ secrets.ORCA_UPDATER_SIG_KEY }}
      # Overridable from repo variables so the NSIS stub version can be A/B-tested
      # (some antivirus engines flag the stub a given NSIS release emits) without
      # editing this file. Set repo variables NSIS_VERSION and the matching
      # NSIS_SHA256 together; both default to the pinned 3.13 below.
      NSIS_VERSION: ${{ vars.NSIS_VERSION || '3.13' }}
      NSIS_SHA256: ${{ vars.NSIS_SHA256 || 'BA63DFFC4410EE89193E1CB5A41989991BD77C61068DA17E3156D136B7B0B3D8' }}
      JSIGN_VERSION: '7.6'
      JSIGN_SHA256: 6CF58AA080E7FF82656F320CFF8D4A3BFF30408DF8766806DCBA3740DD839FA5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'

      - name: Detect Ubuntu version
        if: runner.os == 'Linux'
        run: echo "ubuntu-ver=$(lsb_release -rs | tr -d '.')" >> $GITHUB_ENV
        shell: bash

      - name: load cached deps
        if: ${{ !(runner.os == 'macOS' && inputs.macos-combine-only) }}
        id: load_cached_deps
        uses: actions/cache@v6
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}

        # The deps cache is built (and confirmed present) by the upstream Build
        # Deps job, but under repo cache-storage quota pressure it can be evicted
        # by a concurrent matrix leg's cache save before this job gets to restore
        # it. Rebuild deps in place here rather than hard-failing on that race.
      - name: Rebuild deps (cache restore missed)
        if: ${{ !(runner.os == 'macOS' && inputs.macos-combine-only) && steps.load_cached_deps.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/build-deps
        with:
          cache-path: ${{ inputs.cache-path }}
          arch: ${{ inputs.arch }}
          compiler: ${{ inputs.compiler }}
          self-hosted: ${{ vars.SELF_HOSTED }}

      - uses: ./.github/actions/get-cmake

      # Compiler cache. Pushes save it, so main keeps it warm; pull requests
      # restore it and discard what they compiled.
      - name: Compiler cache
        id: ccache
        if: ${{ !inputs.macos-combine-only }}
        uses: ./.github/actions/ccache-restore
        with:
          os: ${{ inputs.os }}
          arch: ${{ inputs.arch }}
          compiler: ${{ inputs.compiler }}

      - name: Get the version and date on Ubuntu and macOS
        if: runner.os != 'Windows'
        run: |
          ver_pure=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ver="PR-${{ github.event.number }}"
            git_commit_hash="${{ github.event.pull_request.head.sha }}"
          else
            ver=V$ver_pure
            git_commit_hash=""
          fi
          echo "ver=$ver" >> $GITHUB_ENV
          echo "ver_pure=$ver_pure" >> $GITHUB_ENV
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "git_commit_hash=$git_commit_hash" >> $GITHUB_ENV
          # Per-arch Linux AppImage naming: amd64 keeps the historical unsuffixed
          # name (arch_suffix empty). Unused on macOS/Windows.
          if [ '${{ inputs.arch }}' = 'aarch64' ]; then
            echo "arch_suffix=_aarch64" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Get the version and date on Windows
        if: runner.os == 'Windows'
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $ref = "${{ github.ref }}"
          $eventName = "${{ github.event_name }}"
          $prNumber = "${{ github.event.number }}"

          if ($eventName -eq 'pull_request') {
              $ver = "PR" + $prNumber
              $git_commit_hash = "${{ github.event.pull_request.head.sha }}"
          } else {
              $versionContent = Get-Content version.inc -Raw
              if ($versionContent -match 'set\(SoftFever_VERSION "(.*?)"\)') {
                  $ver = $matches[1]
              }
              $ver = "V$ver"
              $git_commit_hash = ""
          }

          echo "ver=$ver" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date=$date" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "git_commit_hash=$git_commit_hash" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date: ${{ env.date }} version: ${{ env.ver }}"
        shell: pwsh

      # Builds uploaded to the nightly release check it for updates, and only those; see docs/HLSD/nightly_updates.md.
      # The condition matches the Deploy steps that upload them.
      - name: Mark the build as a nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NanashiTheNameless/OrcaSlicer'
        run: echo "orca_nightly_build=1" >> "$GITHUB_ENV"
        shell: bash

#   Mac
      - name: Install tools mac
        if: runner.os == 'macOS' && !inputs.macos-combine-only
        run: |
          if [ -z "${{ vars.SELF_HOSTED }}" ]; then
            # Runner image ships an untrusted aws/tap we never use; brew warns on
            # every invocation until it is gone (see https://docs.brew.sh/Tap-Trust).
            brew untap aws/tap || true
            brew install libtool
            brew list
          fi
          mkdir -p ${{ github.workspace }}/deps/build/${{ inputs.arch }}

      - name: Free disk space on hosted macOS runner
        if: runner.os == 'macOS' && !vars.SELF_HOSTED
        shell: bash
        run: |
          df -h "${{ github.workspace }}"

          # Hosted macOS images ship several complete Xcode installations. Keep the
          # selected toolchain and remove the versions this build cannot use.
          active_developer_dir="$(xcode-select -p)"
          case "$active_developer_dir" in
            /Applications/Xcode*.app/Contents/Developer)
              active_xcode="${active_developer_dir%/Contents/Developer}"
              ;;
            *)
              echo "::error::Unexpected active Xcode path: $active_developer_dir"
              exit 1
              ;;
          esac
          echo "Keeping active Xcode: $active_xcode"
          while IFS= read -r -d '' xcode; do
            if [ "$xcode" != "$active_xcode" ]; then
              echo "Removing unused Xcode: $xcode"
              sudo rm -rf "$xcode"
            fi
          done < <(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print0)

          # OrcaSlicer neither builds for Android nor runs Apple simulators.
          sudo rm -rf /Users/runner/Library/Android/sdk
          sudo rm -rf /Users/runner/Library/Developer/CoreSimulator
          brew cleanup --prune=all || true

          df -h "${{ github.workspace }}"

      - name: Build slicer mac
        if: runner.os == 'macOS' && !inputs.macos-combine-only
        working-directory: ${{ github.workspace }}
        # arm64 only: build the tests here; the unit_tests_macos job runs them.
        env:
          ORCA_TESTS_BUILD_ONLY: ${{ inputs.arch == 'arm64' && '1' || '' }}
        run: |
          ./build_release_macos.sh -s -n -x ${{ !vars.SELF_HOSTED && '-j 3' || '' }} -a ${{ inputs.arch }} -t 10.15 ${{ inputs.arch == 'arm64' && '-T' || '' }}

      - name: Pack unit tests mac
        if: runner.os == 'macOS' && !inputs.macos-combine-only && inputs.arch == 'arm64'
        working-directory: ${{ github.workspace }}
        run: tar -cvf build_tests.tar build/arm64/tests

      - name: Upload Test Artifact mac
        if: runner.os == 'macOS' && !inputs.macos-combine-only && inputs.arch == 'arm64'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-tests-macos-arm64
          overwrite: true
          path: build_tests.tar
          retention-days: 5
          if-no-files-found: error

      - name: Build system preset cache (macOS)
        if: runner.os == 'macOS' && !inputs.macos-combine-only
        working-directory: ${{ github.workspace }}
        shell: bash
        # The bundle was already packed from resources/, so the caches have to be
        # installed into it here; the source tree keeps its JSONs for later jobs.
        run: ./scripts/build_preset_cache.sh -b build/${{ inputs.arch }} build/${{ inputs.arch }}/OrcaSlicer/OrcaSlicer.app/Contents/Resources/profiles

      - name: Pack macOS app bundle ${{ inputs.arch }}
        if: runner.os == 'macOS' && !inputs.macos-combine-only
        working-directory: ${{ github.workspace }}
        run: |
          tar -czvf OrcaSlicer_Mac_bundle_${{ inputs.arch }}_${{ github.sha }}.tar.gz -C build/${{ inputs.arch }} OrcaSlicer

      - name: Upload macOS app bundle ${{ inputs.arch }}
        if: runner.os == 'macOS' && !inputs.macos-combine-only
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_Mac_bundle_${{ inputs.arch }}_${{ github.sha }}
          path: ${{ github.workspace }}/OrcaSlicer_Mac_bundle_${{ inputs.arch }}_${{ github.sha }}.tar.gz
          retention-days: 7

      - name: Download macOS app bundles
        if: runner.os == 'macOS' && inputs.macos-combine-only
        uses: actions/download-artifact@v8
        with:
          pattern: OrcaSlicer_Mac_bundle_*_${{ github.sha }}
          path: ${{ github.workspace }}/mac_bundles

      - name: Extract macOS app bundles
        if: runner.os == 'macOS' && inputs.macos-combine-only
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p build/arm64 build/x86_64
          arm_bundle=$(find "${{ github.workspace }}/mac_bundles/OrcaSlicer_Mac_bundle_arm64_${{ github.sha }}" -name '*.tar.gz' -print -quit)
          x86_bundle=$(find "${{ github.workspace }}/mac_bundles/OrcaSlicer_Mac_bundle_x86_64_${{ github.sha }}" -name '*.tar.gz' -print -quit)
          tar -xzvf "$arm_bundle" -C "${{ github.workspace }}/build/arm64"
          tar -xzvf "$x86_bundle" -C "${{ github.workspace }}/build/x86_64"

      - name: Build universal mac app bundle
        if: runner.os == 'macOS' && inputs.macos-combine-only
        working-directory: ${{ github.workspace }}
        run: |
          ./build_release_macos.sh -u -x ${{ !vars.SELF_HOSTED && '-j 3' || '' }} -a universal -t 10.15

      - name: Free disk space before macOS packaging
        if: runner.os == 'macOS' && inputs.macos-combine-only
        working-directory: ${{ github.workspace }}
        run: |
          df -h "${{ github.workspace }}"
          # The universal app is now independent of these downloaded and
          # extracted per-architecture bundles.
          rm -rf mac_bundles build/arm64 build/x86_64

      # xcrun stapler fetches the notarization ticket over HTTP/3 (UDP 443),
      # which GitHub-hosted macOS runners drop, failing with Error 68
      # (actions/runner-images#14924). Blocking UDP 443 makes it fall back to
      # TCP. Skipped on self-hosted runners, where the pf rules would outlive
      # the job.
      - name: Force stapler onto TCP
        if: github.repository == 'OrcaSlicer/OrcaSlicer' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && runner.os == 'macOS' && inputs.macos-combine-only && !vars.SELF_HOSTED
        run: |
          echo "block return out quick proto udp from any to any port 443" | sudo pfctl -f -
          sudo pfctl -E

 # Thanks to RaySajuuk, it's working now
      - name: Sign app and notary
        if: github.repository == 'OrcaSlicer/OrcaSlicer' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && runner.os == 'macOS' && inputs.macos-combine-only
        timeout-minutes: 30
        working-directory: ${{ github.workspace }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERTIFICATE_ID: ${{ secrets.MACOS_CERTIFICATE_ID }}
        run: |
          # Load the `retry` and `create_dmg` helpers.
          source ${{ github.workspace }}/scripts/retry.sh
          source ${{ github.workspace }}/scripts/create_dmg.sh
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output $CERTIFICATE_PATH
          security create-keychain -p $KEYCHAIN_PASSWORD $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p $KEYCHAIN_PASSWORD $KEYCHAIN_PATH
          # Set the temporary keychain as the default to prevent codesign from accessing the locked login keychain
          security default-keychain -s "$KEYCHAIN_PATH"
          security import $CERTIFICATE_PATH -P $P12_PASSWORD -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k $P12_PASSWORD $KEYCHAIN_PATH
          # codesign --deep is deprecated and cannot sign the bundled Python
          # runtime (see relocate_python_runtime in build_release_macos.sh).
          # Sign every nested Mach-O in the bundle explicitly -- notarization
          # requires the hardened-runtime signature on each -- then seal the
          # bundle itself last, and verify so coverage gaps fail at CI time
          # rather than at notarization.
          ENTITLEMENTS=${{ github.workspace }}/scripts/disable_validation.entitlements
          sign() {
            codesign --force --options runtime --timestamp --entitlements "$ENTITLEMENTS" --sign "$CERTIFICATE_ID" "$@"
          }
          sign_app() {
            local app="$1"
            local machos=()
            # file is batched via xargs (per-file it costs minutes); universal
            # binaries also print per-architecture lines, dropped by grep -v.
            while IFS= read -r f; do machos+=("$f"); done < <(
              find "$app" -type f -print0 |
                xargs -0 file --no-pad --mime-type -- |
                grep -v ' (for architecture ' |
                grep ': application/x-mach-binary$' |
                sed 's|: application/x-mach-binary$||'
            )
            if [ "${#machos[@]}" -eq 0 ]; then
              echo "ERROR: no Mach-O files found in $app -- detection is broken" >&2
              exit 1
            fi
            echo "signing ${#machos[@]} Mach-O files in $app"
            sign "${machos[@]}"
            sign --verbose "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
          }
          sign_app "${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer.app"
          # Sign OrcaSlicer_profile_validator.app if it exists
          if [ -f "${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer_profile_validator.app/Contents/MacOS/OrcaSlicer_profile_validator" ]; then
            sign_app "${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer_profile_validator.app"
          fi

          # Create main OrcaSlicer DMG without the profile validator helper
          mkdir -p ${{ github.workspace }}/build/universal/OrcaSlicer_dmg
          rm -rf ${{ github.workspace }}/build/universal/OrcaSlicer_dmg/*
          cp -R ${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer.app ${{ github.workspace }}/build/universal/OrcaSlicer_dmg/
          ln -sfn /Applications ${{ github.workspace }}/build/universal/OrcaSlicer_dmg/Applications
          create_dmg "OrcaSlicer" ${{ github.workspace }}/build/universal/OrcaSlicer_dmg OrcaSlicer_Mac_universal_${{ env.ver }}.dmg
          codesign --deep --force --verbose --options runtime --timestamp --entitlements "$ENTITLEMENTS" --sign "$CERTIFICATE_ID" OrcaSlicer_Mac_universal_${{ env.ver }}.dmg

          # Create separate OrcaSlicer_profile_validator DMG if the app exists
          if [ -f "${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer_profile_validator.app/Contents/MacOS/OrcaSlicer_profile_validator" ]; then
            mkdir -p ${{ github.workspace }}/build/universal/OrcaSlicer_profile_validator_dmg
            rm -rf ${{ github.workspace }}/build/universal/OrcaSlicer_profile_validator_dmg/*
            cp -R ${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer_profile_validator.app ${{ github.workspace }}/build/universal/OrcaSlicer_profile_validator_dmg/
            ln -sfn /Applications ${{ github.workspace }}/build/universal/OrcaSlicer_profile_validator_dmg/Applications
            create_dmg "OrcaSlicer Profile Validator" ${{ github.workspace }}/build/universal/OrcaSlicer_profile_validator_dmg OrcaSlicer_profile_validator_Mac_universal_${{ env.ver }}.dmg
            codesign --deep --force --verbose --options runtime --timestamp --entitlements "$ENTITLEMENTS" --sign "$CERTIFICATE_ID" OrcaSlicer_profile_validator_Mac_universal_${{ env.ver }}.dmg
          fi

          # Notarize main DMG
          xcrun notarytool submit "OrcaSlicer_Mac_universal_${{ env.ver }}.dmg" --apple-id "${{ secrets.APPLE_DEV_ACCOUNT }}" --team-id "${{ secrets.TEAM_ID }}" --password "${{ secrets.APP_PWD }}" --wait
          retry xcrun stapler staple OrcaSlicer_Mac_universal_${{ env.ver }}.dmg

          # Notarize profile validator DMG if it exists
          if [ -f "OrcaSlicer_profile_validator_Mac_universal_${{ env.ver }}.dmg" ]; then
            xcrun notarytool submit "OrcaSlicer_profile_validator_Mac_universal_${{ env.ver }}.dmg" --apple-id "${{ secrets.APPLE_DEV_ACCOUNT }}" --team-id "${{ secrets.TEAM_ID }}" --password "${{ secrets.APP_PWD }}" --wait
            retry xcrun stapler staple OrcaSlicer_profile_validator_Mac_universal_${{ env.ver }}.dmg
          fi

      - name: Sign NamelessNanashi macOS apps
        if: env.NN_SIGNING_ENABLED == 'true' && runner.os == 'macOS' && inputs.macos-combine-only
        timeout-minutes: 30
        env:
          NN_SIGNING_MACOS_P12_BASE64: ${{ secrets.NN_SIGNING_MACOS_P12_BASE64 }}
          NN_SIGNING_PASSWORD: ${{ secrets.NN_SIGNING_PASSWORD }}
        shell: bash
        run: |
          test -n "$NN_SIGNING_MACOS_P12_BASE64" && test -n "$NN_SIGNING_PASSWORD"
          apps=(build/universal/OrcaSlicer/OrcaSlicer.app)
          validator=build/universal/OrcaSlicer/OrcaSlicer_profile_validator.app
          if [ -d "$validator" ]; then apps+=("$validator"); fi
          python3 signing/scripts/sign-macos-build.py "${apps[@]}"

      - name: Create DMG without notary
        # Upstream skips this on main because its "Sign app and notary" step
        # (Apple notarization, needs org secrets) builds the DMG there instead. This fork
        # has no notarization step, so it must always build the DMG itself.
        if: (github.repository != 'OrcaSlicer/OrcaSlicer' || github.ref != 'refs/heads/main') && runner.os == 'macOS' && inputs.macos-combine-only
        working-directory: ${{ github.workspace }}
        run: |
          # Load the `retry` and `create_dmg` helpers.
          source ${{ github.workspace }}/scripts/retry.sh
          # hdiutil's -srcfolder size estimate can undershoot for bundles holding a
          # single large binary, failing with "No space left on device" inside the
          # scratch volume. Size it explicitly from the staged content plus headroom.
          dmg_size() { echo "$(( $(du -sm "$1" | cut -f1) * 12 / 10 + 64 ))m"; }
          df -h "${{ github.workspace }}"
          main_dmg_dir="${{ github.workspace }}/build/universal/OrcaSlicer_dmg"
          rm -rf "$main_dmg_dir"
          mkdir -p "$main_dmg_dir"
          # The universal app is no longer needed after packaging. Move it into
          # the staging directory to avoid consuming space for a full copy.
          mv "${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer.app" "$main_dmg_dir/"
          ln -sfn /Applications "$main_dmg_dir/Applications"
          retry hdiutil create -volname "OrcaSlicer" -srcfolder "$main_dmg_dir" -size "$(dmg_size "$main_dmg_dir")" -ov -format UDZO "OrcaSlicer_Mac_universal_${{ env.ver }}.dmg"
          # The in-app updater replaces the installed app with this archive; see docs/HLSD/nightly_updates.md.
          # COPYFILE_DISABLE keeps macOS metadata (._ files) out of it.
          COPYFILE_DISABLE=1 tar -czf "OrcaSlicer_Mac_universal_${{ env.ver }}.app.tar.gz" -C "$main_dmg_dir" OrcaSlicer.app
          rm -rf "$main_dmg_dir"
          df -h "${{ github.workspace }}"

          # Create separate OrcaSlicer_profile_validator DMG if the app exists
          if [ -f "${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer_profile_validator.app/Contents/MacOS/OrcaSlicer_profile_validator" ]; then
            validator_dmg_dir="${{ github.workspace }}/build/universal/OrcaSlicer_profile_validator_dmg"
            rm -rf "$validator_dmg_dir"
            mkdir -p "$validator_dmg_dir"
            mv "${{ github.workspace }}/build/universal/OrcaSlicer/OrcaSlicer_profile_validator.app" "$validator_dmg_dir/"
            ln -sfn /Applications "$validator_dmg_dir/Applications"
            retry hdiutil create -volname "OrcaSlicer Profile Validator" -srcfolder "$validator_dmg_dir" -size "$(dmg_size "$validator_dmg_dir")" -ov -format UDZO "OrcaSlicer_profile_validator_Mac_universal_${{ env.ver }}.dmg"
            rm -rf "$validator_dmg_dir"
          fi

      - name: Sign macOS downloads
        if: env.NN_SIGNING_ENABLED == 'true' && runner.os == 'macOS' && inputs.macos-combine-only
        uses: ./.github/actions/sign-downloads
        with:
          key: ${{ secrets.NN_SIGNING_KEY_PEM_BASE64 }}
          password: ${{ secrets.NN_SIGNING_PASSWORD }}
          artifact-name: NamelessNanashi-signatures-macOS-universal
          files: |
            OrcaSlicer_Mac_universal_${{ env.ver }}.dmg
            OrcaSlicer_Mac_universal_${{ env.ver }}.app.tar.gz
          optional-files: OrcaSlicer_profile_validator_Mac_universal_${{ env.ver }}.dmg

      # Delete the per-arch bundles only after DMG creation succeeded, so a
      # failed run keeps them available for a re-run instead of forcing a full rebuild.
      - name: Delete intermediate per-arch artifacts
        if: success() && runner.os == 'macOS' && inputs.macos-combine-only
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            OrcaSlicer_Mac_bundle_arm64_${{ github.sha }}
            OrcaSlicer_Mac_bundle_x86_64_${{ github.sha }}

      - name: Upload artifacts mac
        if: runner.os == 'macOS' && inputs.macos-combine-only
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_Mac_universal_${{ env.ver }}
          path: ${{ github.workspace }}/OrcaSlicer_Mac_universal_${{ env.ver }}.dmg
          retention-days: 7

      - name: Upload OrcaSlicer_profile_validator DMG mac
        if: runner.os == 'macOS' && inputs.macos-combine-only && !vars.SELF_HOSTED
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_profile_validator_Mac_universal_DMG_${{ env.ver }}
          path: ${{ github.workspace }}/OrcaSlicer_profile_validator_Mac_universal_${{ env.ver }}.dmg
          retention-days: 7
          if-no-files-found: ignore

      - name: Deploy Mac release
        if: runner.os == 'macOS' && inputs.macos-combine-only && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NanashiTheNameless/OrcaSlicer'
        uses: ./.github/actions/deploy-signed-nightly
        with:
          token: ${{ secrets.GH_TOKEN }}
          upload_url: https://uploads.github.com/repos/NanashiTheNameless/OrcaSlicer/releases/242055857/assets{?name,label}
          release_id: 242055857
          asset_path: ${{ github.workspace }}/OrcaSlicer_Mac_universal_${{ env.ver }}.dmg
          asset_name: OrcaSlicer_Mac_universal_nightly.dmg
          asset_content_type: application/octet-stream
          max_releases: 1 # optional, if there are more releases than this matching the asset_name, the oldest ones are going to be deleted

      - name: Deploy Mac app archive
        if: runner.os == 'macOS' && inputs.macos-combine-only && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NanashiTheNameless/OrcaSlicer' && hashFiles(format('OrcaSlicer_Mac_universal_{0}.app.tar.gz', env.ver)) != ''
        uses: ./.github/actions/deploy-signed-nightly
        with:
          token: ${{ secrets.GH_TOKEN }}
          upload_url: https://uploads.github.com/repos/NanashiTheNameless/OrcaSlicer/releases/242055857/assets{?name,label}
          release_id: 242055857
          asset_path: ${{ github.workspace }}/OrcaSlicer_Mac_universal_${{ env.ver }}.app.tar.gz
          asset_name: OrcaSlicer_Mac_universal_nightly.app.tar.gz
          asset_content_type: application/gzip
          max_releases: 1

      # The DMG is only built when the validator app was.
      - name: Deploy Mac OrcaSlicer_profile_validator DMG release
        if: runner.os == 'macOS' && inputs.macos-combine-only && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NanashiTheNameless/OrcaSlicer' && hashFiles(format('OrcaSlicer_profile_validator_Mac_universal_{0}.dmg', env.ver)) != ''
        uses: ./.github/actions/deploy-signed-nightly
        with:
          token: ${{ secrets.GH_TOKEN }}
          upload_url: https://uploads.github.com/repos/NanashiTheNameless/OrcaSlicer/releases/242055857/assets{?name,label}
          release_id: 242055857
          asset_path: ${{ github.workspace }}/OrcaSlicer_profile_validator_Mac_universal_${{ env.ver }}.dmg
          asset_name: OrcaSlicer_profile_validator_Mac_universal_nightly.dmg
          asset_content_type: application/octet-stream
          max_releases: 1

# Windows
      - name: Set Windows build variables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ inputs.arch }}" -eq "arm64") {
            "BUILD_DIR=build-arm64"  | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
            "ARCH_SUFFIX=_arm64"     | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          } else {
            "BUILD_DIR=build"        | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
            "ARCH_SUFFIX=_x64"       | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          }

      - name: setup MSVC
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      # NSIS builds the installer. A pinned portable copy is kept in the Actions
      # cache, so most runs never download it, and a cache miss fetches the
      # release archive from SourceForge instead of going through the Chocolatey
      # community feed, which hosted runners often cannot reach. Prepending it to
      # PATH also makes cpack use it over the NSIS preinstalled on some images.
      - name: Restore NSIS
        id: nsis-cache
        if: runner.os == 'Windows' && !vars.SELF_HOSTED
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/nsis
          key: nsis-${{ env.NSIS_VERSION }}

      - name: Install NSIS
        if: runner.os == 'Windows' && !vars.SELF_HOSTED
        shell: pwsh
        run: |
          dir "C:/Program Files (x86)/Windows Kits/10/Include"
          $nsisDir = Join-Path $env:RUNNER_TEMP 'nsis'
          $makensis = Join-Path $nsisDir 'makensis.exe'
          if (-not (Test-Path $makensis)) {
            $zip = Join-Path $env:RUNNER_TEMP "nsis-$env:NSIS_VERSION.zip"
            curl.exe -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o $zip "https://downloads.sourceforge.net/project/nsis/NSIS%203/$env:NSIS_VERSION/nsis-$env:NSIS_VERSION.zip"
            if ($LASTEXITCODE -ne 0) { throw "NSIS $env:NSIS_VERSION download failed." }
            if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:NSIS_SHA256) {
              throw "NSIS $env:NSIS_VERSION archive does not match its pinned SHA256."
            }
            Expand-Archive $zip $env:RUNNER_TEMP
            Move-Item (Join-Path $env:RUNNER_TEMP "nsis-$env:NSIS_VERSION") $nsisDir
          }
          & $makensis /VERSION
          $nsisDir | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Save NSIS
        if: runner.os == 'Windows' && !vars.SELF_HOSTED && steps.nsis-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/nsis
          key: nsis-${{ env.NSIS_VERSION }}

      # Windows release builds are Authenticode-signed with the company's key in Google Cloud KMS
      # (README, Code Signing Policy): pushes, schedules and manual runs of main and release/* in
      # this repository, once the WINDOWS_SIGN_* variables are set. The Workload Identity provider
      # accepts tokens from nothing else. This runs before the build so that CMake wires signing
      # into the NSIS installer.
      - name: Configure code signing
        id: codesign
        if: runner.os == 'Windows' && github.repository == 'OrcaSlicer/OrcaSlicer' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && github.event_name != 'pull_request' && vars.WINDOWS_SIGN_KMS_KEY != ''
        shell: pwsh
        env:
          CERT_CHAIN: ${{ vars.WINDOWS_SIGN_CERT_CHAIN }}
          KMS_KEY: ${{ vars.WINDOWS_SIGN_KMS_KEY }}
        run: |
          $jar = Join-Path $env:RUNNER_TEMP "jsign-$env:JSIGN_VERSION.jar"
          curl.exe -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o $jar "https://github.com/ebourg/jsign/releases/download/$env:JSIGN_VERSION/jsign-$env:JSIGN_VERSION.jar"
          if ($LASTEXITCODE -ne 0) { throw "Jsign $env:JSIGN_VERSION download failed." }
          if ((Get-FileHash $jar -Algorithm SHA256).Hash -ne $env:JSIGN_SHA256) {
            throw "Jsign $env:JSIGN_VERSION does not match its pinned SHA256."
          }
          $cert = Join-Path $env:RUNNER_TEMP 'codesign-chain.pem'
          Set-Content -LiteralPath $cert -Value $env:CERT_CHAIN
          "ORCA_SIGN_JSIGN=$jar"           | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "ORCA_SIGN_CERTFILE=$cert"       | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          "ORCA_SIGN_KMS_KEY=$env:KMS_KEY" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Set up Java for code signing
        if: steps.codesign.outcome == 'success'
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'

      - name: Build slicer Win
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        # --tests builds the unit tests too; the unit_tests_windows_* jobs run them.
        run: |
          # cache-path is the install directory inside the deps build directory.
          $deps = (Split-Path "${{ inputs.cache-path }}").Replace('\', '/')
          # -l compiles with Visual Studio's clang-cl and -x builds with Ninja; --msvc --msbuild is cl under the Visual Studio generator.
          $flags = if ("${{ inputs.compiler }}" -eq "clang") { "-l", "-x" } else { "--msvc", "--msbuild" }
          .\build_win.bat -s --tests -i --arch ${{ inputs.arch }} --build-dir $env:BUILD_DIR --deps-dir $deps @flags
        shell: pwsh

      - name: Build system preset cache (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        # Shipped into both the already-installed tree (portable zip, MSIX) and
        # the checkout cpack re-installs from when it builds the NSIS installer.
        run: scripts\build_preset_cache.bat --prune-source "%BUILD_DIR%" "resources\profiles" "%BUILD_DIR%\OrcaSlicer\resources\profiles"

      # Taken after the build because the token lasts an hour, which covers signing, the installer
      # build and the checks.
      - name: Authenticate to Google Cloud for code signing
        id: codesign_auth
        if: steps.codesign.outcome == 'success'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WINDOWS_SIGN_WIF_PROVIDER }}
          service_account: ${{ vars.WINDOWS_SIGN_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false

      # Signs what the portable zip, the artifact and the MSIX package ship, the profile validator,
      # and the NSIS plugins the installer carries. The installer build signs its own copy of the
      # app, since cpack installs the files again.
      - name: Sign Windows binaries
        if: steps.codesign.outcome == 'success'
        shell: pwsh
        env:
          ORCA_SIGN_TOKEN: ${{ steps.codesign_auth.outputs.access_token }}
        run: |
          $paths = @("$env:BUILD_DIR/OrcaSlicer")
          foreach ($extra in 'build/src/Release/OrcaSlicer_profile_validator.exe', "$env:RUNNER_TEMP/nsis/Plugins") {
            if (Test-Path $extra) { $paths += $extra }
          }
          ./scripts/sign_windows.ps1 -Path $paths

      - name: Pack unit tests Win
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: tar -cvf build_tests.tar ${{ env.BUILD_DIR }}/tests

      - name: Upload Test Artifact Win
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-tests-windows-${{ inputs.arch }}
          overwrite: true
          path: build_tests.tar
          retention-days: 5
          if-no-files-found: error

      - name: Sign Windows application binaries
        if: env.NN_SIGNING_ENABLED == 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          NN_SIGNING_PFX_BASE64: ${{ secrets.NN_SIGNING_PFX_BASE64 }}
          NN_SIGNING_PASSWORD: ${{ secrets.NN_SIGNING_PASSWORD }}
        run: |
          if (-not $env:NN_SIGNING_PFX_BASE64 -or -not $env:NN_SIGNING_PASSWORD) { throw 'Missing Windows signing secrets.' }
          ./signing/scripts/sign-windows-build.ps1 -BuildDir $env:BUILD_DIR

      # NSIS is x86-only; it runs (and the installer it emits runs) under ARM64's
      # x86 emulation, packaging the native arm64 payload from build-arm64.
      - name: Create installer Win
        if: runner.os == 'Windows' && !vars.SELF_HOSTED
        working-directory: ${{ github.workspace }}/${{ env.BUILD_DIR }}
        # Read by scripts/sign_windows.ps1 when CMake wired signing into the installer.
        env:
          ORCA_SIGN_TOKEN: ${{ steps.codesign_auth.outputs.access_token }}
        run: |
          cpack -G NSIS
          if ($LASTEXITCODE -ne 0) {
            # makensis writes its errors, and the signing hook's output, only to this log.
            Get-Content _CPack_Packages/*/NSIS/NSISOutput.log -Tail 80
            exit 1
          }

      # Checks the shipped files, the installer, the payload inside it (7-Zip unpacks NSIS
      # installers) and the uninstaller a silent install writes.
      - name: Verify Windows signatures
        if: steps.codesign.outcome == 'success'
        timeout-minutes: 20
        shell: pwsh
        run: |
          $paths = @("$env:BUILD_DIR/OrcaSlicer")
          $validator = 'build/src/Release/OrcaSlicer_profile_validator.exe'
          if (Test-Path $validator) { $paths += $validator }
          $installer = Get-ChildItem "$env:BUILD_DIR/OrcaSlicer_Windows_Installer_*.exe" | Select-Object -First 1
          if ($installer) {
            $payload = Join-Path $env:RUNNER_TEMP 'installer-payload'
            & 'C:/Program Files/7-Zip/7z.exe' x -y "-o$payload" $installer.FullName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7-Zip could not unpack $($installer.Name)." }
            $installed = Join-Path $env:RUNNER_TEMP 'installer-test'
            Start-Process -Wait -FilePath $installer.FullName -ArgumentList '/S', "/D=$installed"
            $paths += $installer.FullName, $payload, (Join-Path $installed 'Uninstall.exe')
          }
          ./scripts/sign_windows.ps1 -Verify -Path $paths

      - name: Sign Windows installer
        if: env.NN_SIGNING_ENABLED == 'true' && runner.os == 'Windows' && !vars.SELF_HOSTED
        shell: pwsh
        env:
          NN_SIGNING_PFX_BASE64: ${{ secrets.NN_SIGNING_PFX_BASE64 }}
          NN_SIGNING_PASSWORD: ${{ secrets.NN_SIGNING_PASSWORD }}
        run: |
          if (-not $env:NN_SIGNING_PFX_BASE64 -or -not $env:NN_SIGNING_PASSWORD) { throw 'Missing Windows signing secrets.' }
          ./signing/scripts/sign-windows-build.ps1 -BuildDir $env:BUILD_DIR -Stage Installer

      - name: Pack app
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}/${{ env.BUILD_DIR }}
        shell: cmd
        run: '"C:/Program Files/7-Zip/7z.exe" a -tzip OrcaSlicer_Windows_${{ env.ver }}${{ env.ARCH_SUFFIX }}_portable.zip ${{ github.workspace }}/${{ env.BUILD_DIR }}/OrcaSlicer'

      - name: Pack PDB
        if: runner.os == 'Windows' && inputs.arch != 'arm64' && !vars.SELF_HOSTED
        working-directory: ${{ github.workspace }}/${{ env.BUILD_DIR }}/src/Release
        shell: cmd
        run: '"C:/Program Files/7-Zip/7z.exe" a -m0=lzma2 -mx9 Debug_PDB_${{ env.ver }}_for_developers_only.7z  *.pdb'

      - name: Sign Windows downloads
        if: env.NN_SIGNING_ENABLED == 'true' && runner.os == 'Windows'
        uses: ./.github/actions/sign-downloads
        with:
          key: ${{ secrets.NN_SIGNING_KEY_PEM_BASE64 }}
          password: ${{ secrets.NN_SIGNING_PASSWORD }}
          artifact-name: NamelessNanashi-signatures-Windows-${{ inputs.arch }}
          files: ${{ env.BUILD_DIR }}/OrcaSlicer_Windows_${{ env.ver }}${{ env.ARCH_SUFFIX }}_portable.zip
          optional-files: |
            ${{ env.BUILD_DIR }}/OrcaSlicer_Windows_Installer_${{ env.ver }}${{ env.ARCH_SUFFIX }}.exe
            ${{ env.BUILD_DIR }}/src/Release/OrcaSlicer_profile_validator.exe

      - name: Upload artifacts Win zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_Windows_${{ env.ver }}${{ env.ARCH_SUFFIX }}_portable
          path: ${{ github.workspace }}/${{ env.BUILD_DIR }}/OrcaSlicer_Windows_${{ env.ver }}${{ env.ARCH_SUFFIX }}_portable.zip
          retention-days: 7

      - name: Upload artifacts Win installer
        if: runner.os == 'Windows' && !vars.SELF_HOSTED
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_Windows_${{ env.ver }}${{ env.ARCH_SUFFIX }}
          path: ${{ github.workspace }}/${{ env.BUILD_DIR }}/OrcaSlicer*.exe
          retention-days: 7

      - name: Upload artifacts Win PDB
        if: runner.os == 'Windows' && inputs.arch != 'arm64' && !vars.SELF_HOSTED
        uses: actions/upload-artifact@v7
        with:
          name: PDB
          path: ${{ github.workspace }}/build/src/Release/Debug_PDB_${{ env.ver }}_for_developers_only.7z
          retention-days: 7

      - name: Upload OrcaSlicer_profile_validator Win
        if: runner.os == 'Windows' && inputs.arch != 'arm64' && !vars.SELF_HOSTED
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_profile_validator_Windows_${{ env.ver }}
          path: ${{ github.workspace }}/build/src/Release/OrcaSlicer_profile_validator.exe
          retention-days: 7

      - name: Check exception throw info Win
        if: runner.os == 'Windows' && inputs.compiler == 'clang'
        working-directory: ${{ github.workspace }}
        # After the uploads, so a failure still leaves the build and its PDB to inspect, and before any deploy.
        shell: pwsh
        run: scripts\check_exception_throw_info.ps1 -BuildDir $env:BUILD_DIR

      - name: Deploy Windows release portable (x64)
        if: runner.os == 'Windows' && inputs.arch == 'x64' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NanashiTheNameless/OrcaSlicer'
        uses: ./.github/actions/deploy-signed-nightly
        with:
          token: ${{ secrets.GH_TOKEN }}
          upload_url: https://uploads.github.com/repos/NanashiTheNameless/OrcaSlicer/releases/242055857/assets{?name,label}
          release_id: 242055857
          asset_path: ${{ github.workspace }}/${{ env.BUILD_DIR }}/OrcaSlicer_Windows_${{ env.ver }}${{ env.ARCH_SUFFIX }}_portable.zip
          asset_name: OrcaSlicer_Windows_portable_nightly.zip
          asset_content_type: application/x-zip-compressed
          max_releases: 1

      - name: Deploy Windows release portable (arm64)
        if: runner.os == 'Windows' && inputs.arch == 'arm64' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NanashiTheNameless/OrcaSlicer'
        uses: ./.github/actions/deploy-signed-nightly
        with:
          token: ${{ secrets.GH_TOKEN }}
          upload_url: https://uploads.github.com/repos/NanashiTheNameless/OrcaSlicer/releases/242055857/assets{?name,label}
          release_id: 242055857
          asset_path: ${{ github.workspace }}/${{ env.BUILD_DIR }}/OrcaSlicer_Windows_${{ env.ver }}_arm64_portable.zip
          asset_name: OrcaSlicer_Windows_portable_nightly_arm64.zip
          asset_content_type: application/x-zip-compressed
          max_releases: 1

      - name: Deploy Windows release installer (x64)
        if: runner.os == 'Windows' && inputs.arch == 'x64' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NanashiTheNameless/OrcaSlicer'
        uses: ./.github/actions/deploy-signed-nightly
        with:
          token: ${{ secrets.GH_TOKEN }}
          upload_url: https://uploads.github.com/repos/NanashiTheNameless/OrcaSlicer/releases/242055857/assets{?name,label}
          release_id: 242055857
          asset_path: ${{ github.workspace }}/${{ env.BUILD_DIR }}/OrcaSlicer_Windows_Installer_${{ env.ver }}${{ env.ARCH_SUFFIX }}.exe
          asset_name: OrcaSlicer_Windows_Installer_nightly.exe
          asset_content_type: application/x-msdownload
          max_releases: 1

      - name: Deploy Windows release installer (arm64)
        if: runner.os == 'Windows' && inputs.arch == 'arm64' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NanashiTheNameless/OrcaSlicer'
        uses: ./.github/actions/deploy-signed-nightly
        with:
          token: ${{ secrets.GH_TOKEN }}
          upload_url: https://uploads.github.com/repos/NanashiTheNameless/OrcaSlicer/releases/242055857/assets{?name,label}
          release_id: 242055857
          asset_path: ${{ github.workspace }}/${{ env.BUILD_DIR }}/OrcaSlicer_Windows_Installer_${{ env.ver }}${{ env.ARCH_SUFFIX }}.exe
          asset_name: OrcaSlicer_Windows_Installer_nightly_arm64.exe
          asset_content_type: application/x-msdownload
          max_releases: 1

      - name: Deploy Windows OrcaSlicer_profile_validator release (x64 only)
        if: runner.os == 'Windows' && inputs.arch == 'x64' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NanashiTheNameless/OrcaSlicer'
        uses: ./.github/actions/deploy-signed-nightly
        with:
          token: ${{ secrets.GH_TOKEN }}
          upload_url: https://uploads.github.com/repos/NanashiTheNameless/OrcaSlicer/releases/242055857/assets{?name,label}
          release_id: 242055857
          asset_path: ${{ github.workspace }}/build/src/Release/OrcaSlicer_profile_validator.exe
          asset_name: OrcaSlicer_profile_validator_Windows_nightly.exe
          asset_content_type: application/x-msdownload
          max_releases: 1

      - name: Build MSIX Store package Win
        if: runner.os == 'Windows' && !vars.SELF_HOSTED
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          ./scripts/msix/build_msix.ps1 `
            -InstallDir "${{ github.workspace }}/${{ env.BUILD_DIR }}/OrcaSlicer" `
            -OutputPath "${{ github.workspace }}/${{ env.BUILD_DIR }}/OrcaSlicer_Windows_MSIX_${{ env.ver }}${{ env.ARCH_SUFFIX }}.msix" `
            -Architecture "${{ inputs.arch }}" `
            -IdentityName "${{ vars.ORCA_MSIX_IDENTITY_NAME || 'OrcaSlicer.OrcaSlicer' }}" `
            -Publisher "${{ vars.ORCA_MSIX_PUBLISHER || 'CN=38F7EA55-C73B-4072-B3B2-C8E0EA15BB82' }}" `
            -PublisherDisplayName "${{ vars.ORCA_MSIX_PUBLISHER_DISPLAY_NAME || 'OrcaSlicer' }}"

      # Keep the Store Publisher: Microsoft re-signs Store submissions.
      - name: Sign Windows MSIX download
        if: env.NN_SIGNING_ENABLED == 'true' && runner.os == 'Windows' && !vars.SELF_HOSTED
        uses: ./.github/actions/sign-downloads
        with:
          key: ${{ secrets.NN_SIGNING_KEY_PEM_BASE64 }}
          password: ${{ secrets.NN_SIGNING_PASSWORD }}
          artifact-name: NamelessNanashi-signatures-MSIX-${{ inputs.arch }}
          files: ${{ env.BUILD_DIR }}/OrcaSlicer_Windows_MSIX_${{ env.ver }}${{ env.ARCH_SUFFIX }}.msix

      - name: Upload artifacts Win MSIX
        if: runner.os == 'Windows' && !vars.SELF_HOSTED
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_Windows_MSIX_${{ env.ver }}${{ env.ARCH_SUFFIX }}
          path: ${{ github.workspace }}/${{ env.BUILD_DIR }}/OrcaSlicer_Windows_MSIX_${{ env.ver }}${{ env.ARCH_SUFFIX }}.msix
          retention-days: 7

# Ubuntu
      - name: Apt-Install Dependencies
        if: runner.os == 'Linux' && !vars.SELF_HOSTED
        uses: ./.github/actions/apt-install-deps

        # Tests must built at the same time as the slicer;
        # if you untangle them feel free to separate them here too
      - name: Build slicer and tests
        if: runner.os == 'Linux'
        shell: bash
        env:
          # Ubuntu 22.04's default clang 14 mis-codegens some numeric code (observed
          # as multicolor prints purging 35-45% less filament than the identical
          # source built with the clang 18 that 24.04 ships). Pin clang 18 there
          # instead; deps stay on the cached build since the C++ ABI is stable
          # across these clang versions.
          ORCA_CLANG_VERSION: ${{ env.ubuntu-ver == '2204' && '18' || '' }}
        run: |
          # Build + tar the unit tests (-t) on every leg the unit_tests jobs run:
          # both arches, or amd64 alone on self-hosted runners (no arm server).
          tests=${{ !vars.SELF_HOSTED || inputs.arch != 'aarch64' }}
          if $tests; then flags=-istrlL; else flags=-isrlL; fi
          ./build_linux.sh "$flags"
          ./scripts/check_appimage_libs.sh ./build/package ./build/package/bin/orca-slicer
          appimage=./build/OrcaSlicer_Linux_AppImage${{ env.arch_suffix }}_${{ env.ver }}.AppImage
          mv -n ./build/OrcaSlicer_Linux_V${{ env.ver_pure }}.AppImage "$appimage"
          chmod +x "$appimage"
          if $tests; then tar -cvf build_tests.tar build/tests; fi

        # Use tar because upload-artifacts won't always preserve directory structure
        # and doesn't preserve file permissions
      - name: Upload Test Artifact
        if: runner.os == 'Linux' && (!vars.SELF_HOSTED || inputs.arch != 'aarch64')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-tests-linux-${{ inputs.arch == 'aarch64' && 'aarch64' || 'x86_64' }}
          overwrite: true
          path: build_tests.tar
          retention-days: 5
          if-no-files-found: error

      - name: Build system preset cache (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Both were packed from resources/ before the caches existed, so the
          # AppImage is unpacked first and the caches shipped into it and into
          # the package tree; the source tree keeps its JSONs for later steps.
          appimage=$(find build -maxdepth 1 -name "OrcaSlicer_Linux_AppImage*.AppImage" | head -1)
          chmod +x "$appimage"
          "$appimage" --appimage-extract
          ./scripts/build_preset_cache.sh -b build build/package/resources/profiles squashfs-root/resources/profiles
          # The runtime extracts every directory as 0700, and appimagetool (continuous
          # build 333 onwards) refuses to pack a tree other users cannot read.
          chmod -R a+rX squashfs-root
          appimagetool=$(find build -name "appimagetool.AppImage" | head -1)
          ARCH=$(uname -m) "$appimagetool" --appimage-extract-and-run squashfs-root "$appimage"
          rm -rf squashfs-root
        # Ship the freshly-built validator so slice_check_linux (build_all.yml)
        # can slice-sweep the shipped profiles with this PR's engine. Taken from
        # the aarch64 leg so the sweep also exercises the arm build; x86_64 on
        # SELF_HOSTED, which skips arm64.
      - name: Upload profile validator (for slice check)
        if: ${{ runner.os == 'Linux' && (vars.SELF_HOSTED && inputs.arch != 'aarch64' || !vars.SELF_HOSTED && inputs.arch == 'aarch64') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-profile-validator-linux-${{ inputs.arch == 'aarch64' && 'aarch64' || 'x86_64' }}
          overwrite: true
          path: ./build/src/Release/OrcaSlicer_profile_validator
          retention-days: 5
          if-no-files-found: error

      - name: Run external slicer regression tests
        if: runner.os == 'Linux' && inputs.arch != 'aarch64'
        timeout-minutes: 20
        shell: bash
        run: |
          test_repo_dir="${{ runner.temp }}/orca-test-repo"
          rm -rf "$test_repo_dir"
          git clone --depth 1 https://github.com/OrcaSlicer/orca-test-repo.git "$test_repo_dir"
          python3 "$test_repo_dir/run_test.py" "${{ github.workspace }}/build/package/bin/orca-slicer"

      - name: Build orca_custom_preset_tests
        if: github.ref == 'refs/heads/main' && runner.os == 'Linux' && !vars.SELF_HOSTED && inputs.arch != 'aarch64'
        working-directory: ${{ github.workspace }}/build/src/Release
        shell: bash
        run: |
          ./OrcaSlicer_profile_validator -p ${{ github.workspace }}/resources/profiles -g 1
          cd ${{ github.workspace }}/resources/profiles
          zip -r orca_custom_preset_tests.zip user/

      - name: Sign Linux downloads
        if: env.NN_SIGNING_ENABLED == 'true' && runner.os == 'Linux'
        uses: ./.github/actions/sign-downloads
        with:
          key: ${{ secrets.NN_SIGNING_KEY_PEM_BASE64 }}
          password: ${{ secrets.NN_SIGNING_PASSWORD }}
          artifact-name: NamelessNanashi-signatures-Linux-${{ inputs.arch || 'x86_64' }}
          files: build/OrcaSlicer_Linux_AppImage${{ env.arch_suffix }}_${{ env.ver }}.AppImage
          optional-files: |
            build/src/Release/OrcaSlicer_profile_validator
            build/src/dev-utils/Release/generate_system_cache
            resources/profiles/orca_custom_preset_tests.zip

      - name: Upload artifacts Ubuntu
        if: ${{ ! env.ACT && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_Linux_AppImage${{ env.arch_suffix }}_${{ env.ver }}
          path: "./build/OrcaSlicer_Linux_AppImage${{ env.arch_suffix }}_${{ env.ver }}.AppImage"
          retention-days: 7

      - name: Upload OrcaSlicer_profile_validator Ubuntu
        if: ${{ ! env.ACT && runner.os == 'Linux' && !vars.SELF_HOSTED && inputs.arch != 'aarch64' }}
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_profile_validator_Linux_${{ env.ver }}
          path: './build/src/Release/OrcaSlicer_profile_validator'
          retention-days: 7

      # generate_system_cache is what scripts/build_preset_cache.sh bakes the
      # <vendor>.opc caches with; it was already built by the "Build system
      # preset cache (Linux)" step above. The .opc format is 64-bit
      # little-endian native, i.e. identical across every platform Orca ships,
      # so only the Linux binary is published.
      - name: Upload generate_system_cache Ubuntu
        if: ${{ ! env.ACT && runner.os == 'Linux' && !vars.SELF_HOSTED && inputs.arch != 'aarch64' }}
        uses: actions/upload-artifact@v7
        with:
          name: generate_system_cache_Linux_${{ env.ver }}
          path: './build/src/dev-utils/Release/generate_system_cache'

      - name: Deploy Ubuntu release (amd64)
        if: ${{ (inputs.arch == '' || inputs.arch == null) && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NanashiTheNameless/OrcaSlicer' }}
        uses: ./.github/actions/deploy-signed-nightly
        with:
          token: ${{ secrets.GH_TOKEN }}
          upload_url: https://uploads.github.com/repos/NanashiTheNameless/OrcaSlicer/releases/242055857/assets{?name,label}
          release_id: 242055857
          asset_path: ./build/OrcaSlicer_Linux_AppImage_${{ env.ver }}.AppImage
          asset_name: OrcaSlicer_Linux_AppImage_nightly.AppImage
          asset_content_type: application/octet-stream
          max_releases: 1 # optional, if there are more releases than this matching the asset_name, the oldest ones are going to be deleted
      - name: Deploy Ubuntu release (aarch64)
        if: ${{ inputs.arch == 'aarch64' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NanashiTheNameless/OrcaSlicer' }}
        uses: ./.github/actions/deploy-signed-nightly
        with:
          token: ${{ secrets.GH_TOKEN }}
          upload_url: https://uploads.github.com/repos/NanashiTheNameless/OrcaSlicer/releases/242055857/assets{?name,label}
          release_id: 242055857
          asset_path: ./build/OrcaSlicer_Linux_AppImage_aarch64_${{ env.ver }}.AppImage
          asset_name: OrcaSlicer_Linux_AppImage_nightly_aarch64.AppImage
          asset_content_type: application/octet-stream
          max_releases: 1

      - name: Deploy Ubuntu OrcaSlicer_profile_validator release (amd64 only)
        if: ${{ (inputs.arch == '' || inputs.arch == null) && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NanashiTheNameless/OrcaSlicer' }}
        uses: ./.github/actions/deploy-signed-nightly
        with:
          token: ${{ secrets.GH_TOKEN }}
          upload_url: https://uploads.github.com/repos/NanashiTheNameless/OrcaSlicer/releases/242055857/assets{?name,label}
          release_id: 242055857
          asset_path: ./build/src/Release/OrcaSlicer_profile_validator
          asset_name: OrcaSlicer_profile_validator_Linux
          asset_content_type: application/octet-stream
          max_releases: 1

      - name: Deploy Ubuntu generate_system_cache release
        if: ${{ github.repository == 'NanashiTheNameless/OrcaSlicer' && github.event_name == 'push' && ! env.ACT && github.ref == 'refs/heads/main' && runner.os == 'Linux' && !vars.SELF_HOSTED && inputs.arch != 'aarch64' }}
        uses: ./.github/actions/deploy-signed-nightly
        with:
          token: ${{ secrets.GH_TOKEN }}
          upload_url: https://uploads.github.com/repos/NanashiTheNameless/OrcaSlicer/releases/242055857/assets{?name,label}
          release_id: 242055857
          asset_path: ./build/src/dev-utils/Release/generate_system_cache
          asset_name: generate_system_cache_Linux_nightly
          asset_content_type: application/octet-stream
          max_releases: 1

      - name: Deploy orca_custom_preset_tests
        if: ${{ runner.os == 'Linux' && !vars.SELF_HOSTED && inputs.arch != 'aarch64' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NanashiTheNameless/OrcaSlicer' }}
        uses: ./.github/actions/deploy-signed-nightly
        with:
          token: ${{ secrets.GH_TOKEN }}
          upload_url: https://uploads.github.com/repos/NanashiTheNameless/OrcaSlicer/releases/242055857/assets{?name,label}
          release_id: 242055857
          asset_path: ${{ github.workspace }}/resources/profiles/orca_custom_preset_tests.zip
          asset_name: orca_custom_preset_tests.zip
          asset_content_type: application/octet-stream
          max_releases: 1

      - name: Save compiler cache
        if: ${{ always() && !inputs.macos-combine-only }}
        uses: ./.github/actions/ccache-save
        with:
          restored: ${{ steps.ccache.outputs.restored }}
          job-status: ${{ job.status }}
