name: Build all

on:
  push:
    branches:
     - main
     - release/*
    paths:
     - 'deps/**'
     - 'deps_src/**'
     - 'src/**'
     - '**/CMakeLists.txt'
     - 'cmake/**'
     - 'version.inc'
     - 'localization/**'
     - 'resources/**'
     - ".github/workflows/build_*.yml"
     - '.github/workflows/unit_tests.yml'
     - '.github/actions/**'
     - 'signing/**'
     - ".github/workflows/unit_tests*.yml"
     - 'build_linux.sh'
     - 'build_release_macos.sh'
     - 'build_release_vs.bat'
     - 'build_win.bat'
     - 'scripts/test_build_win.ps1'
     - 'scripts/build_preset_cache.*'
     - 'scripts/prune_cached_presets.ps1'
     - 'scripts/test_prune_cached_presets.ps1'
     - 'scripts/linux.d/**'
     - 'scripts/run_gettext.*'
     - 'scripts/run_unit_tests.sh'
     - 'scripts/retry.sh'
     - 'scripts/check_appimage_libs.sh'
     - 'scripts/appimage_lib_policy.sh'
     - 'scripts/check_exception_throw_info.ps1'
     - 'scripts/test_check_exception_throw_info.ps1'
     - 'scripts/prune_cached_presets.ps1'
     - 'scripts/test_prune_cached_presets.ps1'
     - 'scripts/flatpak/**'
     - 'scripts/msix/**'
     - 'scripts/tests/test_app_signing.py'
     - 'scripts/sign_windows.ps1'
     - 'tests/**'

  pull_request:
    branches:
     - main
     - release/*
    # build_optional.yml keeps the same list, plus scripts/flatpak/**.
    paths:
     - 'deps/**'
     - 'deps_src/**'
     - 'src/**'
     - '**/CMakeLists.txt'
     - 'cmake/**'
     - 'version.inc'
     - ".github/workflows/build_*.yml"
     - ".github/workflows/unit_tests*.yml"
     - 'build_linux.sh'
     - 'build_win.bat'
     - 'scripts/test_build_win.ps1'
     - 'build_release_macos.sh'
     - '.github/actions/**'
     - 'signing/**'
     - 'scripts/build_preset_cache.*'
     - 'scripts/check_exception_throw_info.ps1'
     - 'scripts/test_check_exception_throw_info.ps1'
     - 'scripts/prune_cached_presets.ps1'
     - 'scripts/test_prune_cached_presets.ps1'
     - 'scripts/msix/**'
     - 'scripts/tests/test_app_signing.py'
     - 'scripts/sign_windows.ps1'
     - 'tests/**'

  workflow_dispatch: # allows for manual dispatch
    inputs:
      build-deps-only:
        description: 'Only build dependencies (bypasses caching)'
        type: boolean
        default: false

concurrency:
  group: build-all-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Pushes don't cancel a running build, because only a finished branch build
  # saves caches every pull request can restore.
  cancel-in-progress: false
  

jobs:
  check_app_signing:
    name: App signing tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: 'false'
      - run: python3 -m unittest scripts.tests.test_app_signing -v

  # build_win.bat and two of the scripts it runs ship test suites. They run
  # before the Windows builds, on a pull request only when it changes one of
  # the scripts or the suites: the suites build their own fixtures and read
  # nothing else from the tree. Pushes and the nightly always run them.
  build_script_changes:
    name: Look for build script changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'
          # The merge commit plus its first parent, the base it is diffed against.
          fetch-depth: 2
          sparse-checkout: .github/workflows
      - name: Look for changed files
        id: changes
        run: |
          if git diff --quiet HEAD^1 HEAD -- build_win.bat .github/workflows/build_all.yml \
              scripts/check_exception_throw_info.ps1 scripts/prune_cached_presets.ps1 \
              scripts/test_build_win.ps1 scripts/test_check_exception_throw_info.ps1 scripts/test_prune_cached_presets.ps1; then
            echo "No build script changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  check_build_script:
    name: Windows build script tests
    needs: build_script_changes
    # Runs unless the lookup ran and found nothing: skipped off pull requests,
    # and failed lookups run the suites rather than skip them.
    if: ${{ !cancelled() && (needs.build_script_changes.result != 'success' || needs.build_script_changes.outputs.changed == 'true') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'

      # Windows PowerShell rather than pwsh: the suite drives build_win.bat
      # through cmd, and the two differ in how they quote native arguments.
      - name: Run the build script test suite
        shell: powershell
        run: .\scripts\test_build_win.ps1

      - name: Run the exception throw info check tests
        shell: powershell
        run: .\scripts\test_check_exception_throw_info.ps1

      - name: Run the preset prune tests
        shell: powershell
        run: .\scripts\test_prune_cached_presets.ps1

  build_linux:
    strategy:
      fail-fast: false
      # One AppImage per arch, built on Ubuntu 24.04: it needs the host's glibc,
      # libstdc++, GTK and WebKitGTK to be at least as new as the build's, so it
      # does not run on older distros (Ubuntu 22.04, Debian 12); the launcher
      # detects that and points to the Flatpak. SELF_HOSTED skips arm64 (no arm
      # self-hosted server). amd64's
      # empty arch is load-bearing: it keeps the deps cache key unsuffixed
      # ('linux-clang-<os>', which clang_tidy.yml restores) and the unsuffixed
      # asset names.
      matrix:
        include:
          - arch: ""
            os: ${{ vars.SELF_HOSTED && 'orca-lnx-server' || 'ubuntu-24.04' }}
          - arch: "aarch64"
            os: ubuntu-24.04-arm
    # Don't run scheduled builds on forks:
    if: ${{ !cancelled() && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
    secrets: inherit
  build_windows:
    name: Build Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      # SELF_HOSTED skips arm64 (the self-hosted Windows server is x64-only).
      # So does a pull request; build_optional.yml builds arm64 on the
      # build-windows-arm64 label or a change outside the sources.
      matrix:
        include: ${{ fromJSON(vars.SELF_HOSTED
          && '[{"arch":"x64","os":"orca-win-server","compiler":"clang"}]'
          || (github.event_name == 'pull_request'
            && '[{"arch":"x64","os":"windows-latest","compiler":"clang"}]'
            || '[{"arch":"x64","os":"windows-latest","compiler":"clang"},{"arch":"arm64","os":"windows-11-vs2026-arm","compiler":"clang"}]')) }}
    needs: check_build_script
    # id-token lets release builds sign through Google Cloud Workload Identity Federation (see
    # "Configure code signing" in build_orca.yml); the rest is what the build already used.
    permissions:
      actions: write
      contents: write
      id-token: write
    # Don't run scheduled builds on forks:
    if: ${{ !cancelled() && contains(fromJSON('["success", "skipped"]'), needs.check_build_script.result) && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      compiler: ${{ matrix.compiler }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
      force-build: ${{ github.event_name == 'schedule' }}
    secrets: inherit
  build_macos_arch:
    strategy:
      fail-fast: false
      # Hosted macOS runners are scarce, so a pull request builds arm64 only and
      # ships it as its own DMG; build_optional.yml builds x86_64 on the
      # build-macos-x86_64 label. Pushes build both and combine them below.
      matrix:
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["arm64"]' || '["arm64", "x86_64"]') }}
    # Don't run scheduled builds on forks:
    if: ${{ !cancelled() && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-macos-arm64' || 'macos-26' }}
      arch: ${{ matrix.arch }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
      force-build: ${{ github.event_name == 'schedule' }}
    secrets: inherit
  build_macos_universal:
    name: Build macOS Universal
    needs: build_macos_arch
    if: ${{ !cancelled() && needs.build_macos_arch.result == 'success' && !inputs.build-deps-only && github.event_name != 'pull_request' && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    uses: ./.github/workflows/build_orca.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-macos-arm64' || 'macos-26' }}
      arch: universal
      macos-combine-only: true
    secrets: inherit
  # One test job per built arch.
  unit_tests_linux_x86_64:
    name: Linux x86_64
    needs: build_linux
    if: ${{ !cancelled() && success() && !inputs.build-deps-only }}
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-lnx-server' || 'ubuntu-24.04' }}
      artifact: ${{ github.sha }}-tests-linux-x86_64
  unit_tests_linux_aarch64:
    name: Linux aarch64
    needs: build_linux
    if: ${{ !cancelled() && success() && !inputs.build-deps-only && !vars.SELF_HOSTED }}
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: ubuntu-24.04-arm
      artifact: ${{ github.sha }}-tests-linux-aarch64
  # The explicit result, as the script tests ahead of the build may be skipped.
  unit_tests_windows_x64:
    name: Windows x64
    needs: build_windows
    if: ${{ !cancelled() && needs.build_windows.result == 'success' && !inputs.build-deps-only }}
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-win-server' || 'windows-latest' }}
      artifact: ${{ github.sha }}-tests-windows-x64
  unit_tests_windows_arm64:
    name: Windows arm64
    needs: build_windows
    if: ${{ !cancelled() && needs.build_windows.result == 'success' && !inputs.build-deps-only && !vars.SELF_HOSTED && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: windows-11-vs2026-arm
      artifact: ${{ github.sha }}-tests-windows-arm64
      test-dir: build-arm64/tests
  unit_tests_macos_arm64:
    name: macOS arm64
    needs: build_macos_arch
    if: ${{ !cancelled() && success() && !inputs.build-deps-only }}
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-macos-arm64' || 'macos-26' }}
      artifact: ${{ github.sha }}-tests-macos-arm64
      test-dir: build/arm64/tests
  # Slice a two-colour cube through every shipped printer, and through every
  # system process/filament whose templates no printer's own slice reaches, so
  # every custom g-code and filename_format shipped is expanded (names in {if}
  # branches not taken included) - catches slicing regressions the static
  # profile checks and unit tests can't see.
  # Profile-only PRs are covered by check_profiles.yml's nightly binary; this
  # covers src/engine PRs with the PR-built binary.
  slice_check_linux:
    name: Slice check (Linux ${{ vars.SELF_HOSTED && 'x86_64' || 'aarch64' }})
    needs: build_linux
    if: ${{ !cancelled() && success() }}
    # Follows whichever Linux leg built the validator.
    runs-on: ${{ vars.SELF_HOSTED && 'orca-lnx-server' || 'ubuntu-24.04-arm' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download profile validator
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.sha }}-profile-validator-linux-${{ vars.SELF_HOSTED && 'x86_64' || 'aarch64' }}
          path: validator-bin
      - name: Validate slice (expand custom g-code)
        timeout-minutes: 60
        run: |
          chmod +x validator-bin/OrcaSlicer_profile_validator
          ./validator-bin/OrcaSlicer_profile_validator -p "${{ github.workspace }}/resources/profiles" -s -l 2
  publish_test_results:
    name: Publish Test Results
    needs: [unit_tests_linux_x86_64, unit_tests_linux_aarch64, unit_tests_windows_x64, unit_tests_windows_arm64, unit_tests_macos_arm64, flatpak]
    # A deps-only dispatch does not produce test artifacts.
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || !inputs.build-deps-only) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Test Results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: test-results
      # Best-effort: a read-only token (e.g. fork PRs) can't write the check, so
      # don't let a publish failure fail the run. The test jobs gate correctness.
      - name: Publish Test Results
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "test-results/**/*.xml"
      - name: Delete Test Results
        if: success()
        uses: geekyeggo/delete-artifact@v6
        with:
          name: test-results-*
          failOnError: false
  # Pull requests build it on the build-flatpak label, from build_optional.yml.
  flatpak:
    name: Flatpak
    # Don't run scheduled builds on forks; skip entirely on self-hosted runners
    if: ${{ !cancelled() && !vars.SELF_HOSTED && !inputs.build-deps-only && github.event_name != 'pull_request' && (github.event_name != 'schedule' || github.repository == 'OrcaSlicer/OrcaSlicer') }}
    uses: ./.github/workflows/build_flatpak.yml
    secrets: inherit

  deploy_nightly_rolling_tag:
    name: Deploy Nightly-Rolling release tag
    needs:
      - check_app_signing
      - check_build_script
      - build_linux
      - build_windows
      - build_macos_arch
      - build_macos_universal
      - unit_tests_linux_x86_64
      - unit_tests_linux_aarch64
      - unit_tests_windows_x64
      - unit_tests_windows_arm64
      - unit_tests_macos_arm64
      - slice_check_linux
      - publish_test_results
      - flatpak
    # This job only moves the tag; the release assets are uploaded by the build
    # jobs above, so it may only run once every one of them has finished
    # without failing. always() also ran it on a red build, and the force-pushed
    # tag then named a commit with no assets on the nightly release. A job
    # skipped on purpose (no arm runner, no flatpak) is not a failure and still
    # lets this run; a cancelled run has no complete build either and is skipped.
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NanashiTheNameless/OrcaSlicer' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'
      # The manifest nightly builds check for updates (docs/HLSD/nightly_updates.md). It is written here, once
      # every build of the run has uploaded its file, so it only names files that are on the release.
      - name: Write the nightly manifest
        id: manifest
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NIGHTLY_MANIFEST_KEY: ${{ secrets.NIGHTLY_MANIFEST_KEY }}
        run: |
          set -euo pipefail
          commit_time=$(git log -1 --format=%ct)
          # Runs of main take turns, but a re-run of an older one can still finish last; it must not put its
          # older manifest back.
          if curl -fsSL "https://github.com/${{ github.repository }}/releases/download/Nightly-Rolling/latest.json" -o "$RUNNER_TEMP/published.json"; then
            published=$(jq -r '.commit_time // 0' "$RUNNER_TEMP/published.json")
            if [ "$published" -gt "$commit_time" ]; then
              echo "A manifest for a newer commit is already published; leaving it."
              exit 0
            fi
          fi
          gh api "repos/${{ github.repository }}/releases/242055857" > "$RUNNER_TEMP/release.json"
          # Files uploaded since the first attempt of this run started are its own: the previous run of main
          # had finished by then. A re-run attempt starts later, so it would miss what the first one uploaded.
          since=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/1" --jq .run_started_at)
          ver=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
          python3 -I scripts/nightly_manifest.py --release "$RUNNER_TEMP/release.json" \
            --commit "${{ github.sha }}" --commit-time "$commit_time" --commit-date "$(git log -1 --format=%cI)" \
            --since "$since" --version "$ver" --output latest.json
          if [ -n "$NIGHTLY_MANIFEST_KEY" ]; then
            printf '%s\n' "$NIGHTLY_MANIFEST_KEY" > "$RUNNER_TEMP/manifest_key.pem"
            openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/manifest_key.pem" -in latest.json -out "$RUNNER_TEMP/latest.json.sig.bin"
            rm -f "$RUNNER_TEMP/manifest_key.pem"
            base64 -w0 "$RUNNER_TEMP/latest.json.sig.bin" > latest.json.sig
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::NIGHTLY_MANIFEST_KEY is not set, so latest.json is unsigned and builds only notify about it."
          fi
          echo "written=true" >> "$GITHUB_OUTPUT"
      # The signature goes up first: a build that fetches the new manifest with the old signature rejects it and
      # tries again later, while the other order would leave a moment where neither matches.
      - name: Deploy the nightly manifest signature
        if: steps.manifest.outputs.signed == 'true'
        uses: NanashiTheNameless/deploy-nightly@master
        with:
          token: ${{ secrets.GH_TOKEN }}
          upload_url: https://uploads.github.com/repos/NanashiTheNameless/OrcaSlicer/releases/242055857/assets{?name,label}
          release_id: 242055857
          asset_path: ${{ github.workspace }}/latest.json.sig
          asset_name: latest.json.sig
          asset_content_type: text/plain
          max_releases: 1
      - name: Deploy the nightly manifest
        if: steps.manifest.outputs.written == 'true'
        uses: NanashiTheNameless/deploy-nightly@master
        with:
          token: ${{ secrets.GH_TOKEN }}
          upload_url: https://uploads.github.com/repos/NanashiTheNameless/OrcaSlicer/releases/242055857/assets{?name,label}
          release_id: 242055857
          asset_path: ${{ github.workspace }}/latest.json
          asset_name: latest.json
          asset_content_type: application/json
          max_releases: 1
      - name: Publish signing public key and verification instructions
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release upload Nightly-Rolling --repo "$GITHUB_REPOSITORY" --clobber \
            signing/public/release-public-key.pem signing/public/PUBLIC-KEY-SHA256.txt \
            signing/public/identity.cer signing/public/identity.json signing/README.md
      - name: Deploy Nightly-Rolling release tag
        uses: NanashiTheNameless/action-create-tag@main
        with:
          tag: "Nightly-Rolling"
          tag_exists_error: false
          force_push_tag: true
          message: "Nightly-Rolling"
          github_token: ${{ secrets.GH_TOKEN }}
