name: Bug Report
description: Report a bug or issue with OrcaSlicer
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        # Important Notice
        **This is an unofficial fork of OrcaSlicer. Please do NOT report bugs found here to the official OrcaSlicer repository.**

        Please note that this is not the place to make feature requests or ask for help.
        For this, please use the [Feature request](https://github.com/NanashiTheNameless/OrcaSlicer/issues/new?assignees=&labels=&projects=&template=feature_request.yml) issue type.

        If Orca Slicer closes on its own, freezes or stops responding, please use the [Crash report](https://github.com/NanashiTheNameless/OrcaSlicer/issues/new?assignees=&labels=&projects=&template=crash_report.yml) form instead. It asks for the logs a crash needs.

        Before filing, please check if the issue already exists (either open or closed) by using the search bar on the issues page. If it does, comment there. Even if it's closed, we can reopen it based on your comment.
  - type: checkboxes
    id: checklist
    attributes:
      label: Is this issue reproducible in the latest nightly build?
      description: >
        Please verify this issue still happens in the latest nightly build first. It may already be fixed there:
        [Nightly builds](https://github.com/NanashiTheNameless/OrcaSlicer/releases/tag/Nightly-Rolling).
      options:
        - label: I have searched the existing issues and this bug has not been reported before
          required: true
        - label: I understand this is an unofficial fork and will not report this issue to the official OrcaSlicer
          required: true
        - label: I included the short Build SHA (7 or 8 chars) from Help > About Orca Slicer into the version field (e.g., abc1234)
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: Please describe the detailed steps to reproduce this issue
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead.
      placeholder: What happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OrcaSlicer Build Number
      description: Paste only the short Build SHA (7 or 8 chars) from Help > About Orca Slicer (e.g., `abc1234` or `abc12345`).
      placeholder: "abc1234"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 10
        - Windows 11
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Linux (Ubuntu/Debian)
        - Linux (Fedora)
        - Linux (Arch)
        - Linux (Flatpak)
        - Linux (Other)

  - type: textarea
    id: file_uploads
    attributes:
      label: Project file & Debug log uploads
      description: |
        Attach the files with the **Paste, drop, or click to add files** control directly underneath this box. Zip anything that is not a `.log`, `.txt` or image, since GitHub rejects other file types, and keep each file under 25 MB.

        * The **project file** used when the problem happened, zipped. Export it just before or after the problem occurs. Even if you did nothing and there is no object on the plate, export it, since we need the configuration it carries. `File` -> `Save project as...`
        * The **log folder**, zipped. `Help` -> `Show Configuration Folder` opens it, or find it at:
          * Windows: `%APPDATA%\OrcaSlicer\log`, usually `C:\Users\<you>\AppData\Roaming\OrcaSlicer\log`
          * macOS: `$HOME/Library/Application Support/OrcaSlicer/log`
          * Linux: `$HOME/.config/OrcaSlicer/log`
          * Flatpak: `$HOME/.var/app/dev.namelessnanashi.OrcaSlicer/config/OrcaSlicer/log`
          * If the zip comes out over 25 MB, attach the newest logs from that folder on their own instead.
      placeholder: |
        Zipped project file
        Zipped log folder
    validations:
      required: true

  - type: input
    id: printer
    attributes:
      label: Printer Model
      description: What printer are you using?
      placeholder: "e.g., Bambu Lab X1C, Prusa MK4, Ender 3"

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (3MF files, G-code, settings, etc.)
